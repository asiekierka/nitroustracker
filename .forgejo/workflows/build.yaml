name: Build

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build-nds:
    name: Build (NDS)
    runs-on: docker
    container: skylyrac/blocksds:slim-latest
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y --no-install-recommends nodejs

      - name: Clone project
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends python3 python3-pil

      - name: Build
        run: make VERSION=git

      - name: Archive artifacts
        uses: actions/upload-artifact@v3
        with:
          name: NitrousTracker (NDS)
          path: |
            nitroustracker*.nds
            CHANGELOG.TXT
            licenses/
            themes/
            README.TXT

  build-3ds:
    name: Build (3DS)
    runs-on: docker
    container: devkitpro/devkitarm:latest
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y --no-install-recommends nodejs

      - name: Clone project
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends python3 python3-pil

      - name: Build
        run: make -f Makefile.3ds VERSION=git

      - name: Archive artifacts
        uses: actions/upload-artifact@v3
        with:
          name: NitrousTracker (3DS)
          path: |
            nitroustracker*.3dsx
            CHANGELOG.TXT
            licenses/
            themes/
            README.TXT
